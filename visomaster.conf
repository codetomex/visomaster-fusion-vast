[program:visomaster]
user=user
environment=HOME="/home/user",DISPLAY=":20",XDG_RUNTIME_DIR="/run/user/1001",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1001/dbus/session_bus_socket",PROC_NAME="%(program_name)s"
command=/opt/start-visomaster.sh --foreground
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

